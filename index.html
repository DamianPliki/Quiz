<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wielki Quiz z Serialu Przyjaciele - 100 Pytań</title>
    <style>
        :root {
            --bg-color: #fdf2f8;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #e11d48;
            --success: #16a34a;
            --danger: #dc2626;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 700px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .badge {
            background-color: #e0f2fe;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .score-badge {
            background-color: #fef3c7;
            color: #d97706;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #14532d;
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--danger);
            color: #7f1d1d;
        }

        .explanation {
            background-color: #f0f9ff;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
        }

        .explanation h4 {
            margin: 0 0 5px 0;
            color: var(--primary);
        }

        .explanation p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: none;
        }

        .action-btn:hover {
            background-color: #be123c;
        }

        .results {
            text-align: center;
            display: none;
        }

        .results h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .iq-box {
            background: linear-gradient(135deg, #e11d48 0%, #4f46e5 100%);
            color: white;
            padding: 25px;
            border-radius: 16px;
            margin: 20px 0;
        }

        .iq-score {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header-status">
            <span class="badge">Pytanie <span id="current-question-num">1</span> z <span id="total-questions">100</span></span>
            <span class="score-badge">Punkty: <span id="current-score">0</span></span>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <h2 id="question-text">Pytanie ładuje się...</h2>
        
        <div class="options-grid" id="options-container"></div>
        
        <div class="explanation" id="explanation-box">
            <h4 id="explanation-title">Wyjaśnienie:</h4>
            <p id="explanation-text"></p>
        </div>
        
        <button class="action-btn" id="next-btn" onclick="nextQuestion()">Następne pytanie</button>
    </div>

    <div class="results" id="results-screen">
        <h2>Test Zakończony!</h2>
        <p>Twój wynik znajomości serialu Przyjaciele:</p>
        
        <div class="iq-box">
            <div>Twój Serialowy Poziom IQ:</div>
            <div class="iq-score" id="iq-value">IQ 140+</div>
            <div id="iq-title" style="font-weight: 600;">Mistrz Central Perk</div>
        </div>

        <p id="feedback-text" style="line-height: 1.6;"></p>
        <button class="restart-btn" onclick="restartQuiz()">Rozwiąż ponownie</button>
    </div>
</div>

<script>
const questions = [
    { q: "Jak ma na imię mała małpka, którą opiekował się Ross?", options: ["Marcel", "Barnaby", "George"], answer: 0, exp: "Marcel był kapucynką Rossa w 1. sezonie serialu." },
    { q: "Jakiej kultowej piosenki uczyła Phoebe grać na gitarze?", options: ["Smelly Cat", "Sticky Shoes", "Angel of the Morning"], answer: 0, exp: "'Smelly Cat' (Cuchnący Kot) to najbardziej znany utwór Phoebe Buffay." },
    { q: "Jak nazywała się kawiarnia, w której spotykali się przyjaciele?", options: ["Central Park Cafe", "Central Perk", "Coffee Perk"], answer: 1, exp: "Kawiarnia nazywa się Central Perk – gra słów nawiązująca do Central Parku." },
    { q: "Czym z zawodu zajmuje się Chandler Bing przez większość pierwszych sezonów?", options: ["Analizą danych i rekonfiguracją danych", "Aktorstwem", "Księgowością bankową"], answer: 0, exp: "Chandler zajmował się przetwarzaniem danych ('Statistical analysis and data reconfiguration')." },
    { q: "Jakie imię nosiła lalka używana przez Joeya do spania?", options: ["Hugsy", "Barnaby", "Teddy"], answer: 0, exp: "Hugsy to ukochany pluszowy pingwin Joeya." },
    { q: "Ile razy Ross Geller brał ślub w trakcie trwania serialu?", options: ["2 razy", "3 razy", "4 razy"], answer: 1, exp: "Ross brał ślub 3 razy: z Carol, Emily oraz z Rachel w Las Vegas." },
    { q: "Jakie było drugie imię Chandlera?", options: ["Francis", "Muriel", "Eustachy"], answer: 1, exp: "Drugie imię Chandlera to Muriel." },
    { q: "Kim z zawodu jest Ross Geller?", options: ["Geologiem", "Paleontologiem", "Biologiem molekularnym"], answer: 1, exp: "Ross jest doktorem paleontologii pracującym m.in. w Muzeum Historii Naturalnej i na uniwersytecie." },
    { q: "Jakie nazwisko panieńskie miała Monica?", options: ["Buffay", "Green", "Geller"], answer: 2, exp: "Monica i Ross to rodzeństwo, oboje noszą nazwisko Geller." },
    { q: "Z kogo była zrobiona słynna kanapka Rossa, którą ktoś zjadł w pracy?", options: ["Z pieczonego indyka ze 'Moist Makerem'", "Z szynki i sera", "Z klopsików"], answer: 0, exp: "Była to kanapka ze świątecznego indyka z dodatkową kromką chleba namoczoną w sosie w środku." },
    { q: "Jak nazywa się bliźniacza siostra Phoebe?", options: ["Ursula", "Pamela", "Fiona"], answer: 0, exp: "Siostra bliźniaczka Phoebe to Ursula, która pracowała jako kelnerka w 'Mad About You'." },
    { q: "Który z bohaterów wypowiada słynne zdanie 'How you doin'?'", options: ["Chandler", "Joey", "Ross"], answer: 1, exp: "To kultowy tekst Joeya Tribbiani używany na podryw." },
    { q: "W jakim mieście odbywa się ślub Rossa i Emily?", options: ["W Nowym Jorku", "W Londynie", "W Paryżu"], answer: 1, exp: "Ślub Rossa i Emily odbył się w ruinach zabytkowego budynku w Londynie." },
    { q: "Czym zajmowała się Rachel Green na samym początku serialu (Sezon 1)?", options: ["Była kelnerką w Central Perk", "Pracowała w Bloomingdale's", "Pracowała u Ralpha Laurena"], answer: 0, exp: "Po ucieczce z własnego ślubu Rachel zaczęła pracować jako kelnerka w kawiarni Central Perk." },
    { q: "Jakie imię nosi brat Phoebe?", options: ["Frank Jr.", "Charles", "David"], answer: 0, exp: "Brat Phoebe to Frank Buffay Jr., dla którego urodziła trojaczki." },
    { q: "Kto był miłością życia Phoebe z okresu przed Mikiem, który wyjechał do Mińska?", options: ["David naukowiec", "Gary policjant", "Duncan łyżwiarz"], answer: 0, exp: "David (naukowiec) wyjechał na badania do Mińska." },
    { q: "W jaki sposób Chandler i Monica zaczęli swój romans?", options: ["Na imprezie w Nowym Jorku", "Podczas wyjazdu na ślub Rossa w Londynie", "W wycieczce do Las Vegas"], answer: 1, exp: "Zbliżyli się do siebie w Londynie w nocy przed ślubem Rossa." },
    { q: "Jak ma na imię pies ze stali/gipsu, którego Joey kupił do nowego mieszkania?", options: ["Pat the Dog", "Barky", "Whitey"], answer: 0, exp: "Wielki biały pies z gipsu nazywał się Pat the Dog." },
    { q: "Kto grał rolę dr. Drake'a Ramoray w serialu 'Dni naszego życia'?", options: ["Joey Tribbiani", "Chandler Bing", "Ross Geller"], answer: 0, exp: "Joey grał neurochirurga Drake'a Ramoraya." },
    { q: "Co Rachel przez pomyłkę dodała do tradycyjnego angielskiego deseru (Trifle)?", options: ["Książkę telefoniczną", "Mięso wołowe z cebulą i groszkiem", "Sos majonezowy"], answer: 1, exp: "Rachel skleiła dwie strony przepisu i połączyła deser owocowy z zapiekanką pasterską." },
    { q: "Jak miała na imię pierwsza żona Rossa, która okazała się lesbijką?", options: ["Carol", "Susan", "Emily"], answer: 0, exp: "Carol Willick była pierwszą żoną Rossa i matką jego syna Bena." },
    { q: "Jak nazywa się syn Rossa i Carol?", options: ["Ben", "Jack", "Emma"], answer: 0, exp: "Syn Rossa i Carol dostał na imię Ben." },

    { q: "Czym groził Ross krzycząc słynne 'PIVOT!'?", options: ["Przenoszeniem kanapy po schodach", "Kładzeniem dywanu", "Pakowaniem walizki"], answer: 0, exp: "Krzyczał 'PIVOT!' podczas próby wniesienia nowej kanapy po wąskiej klatce schodowej." },
    { q: "Jak nazywała się postać grana przez Brada Pitta w odcinku dziękczynnym?", options: ["Will Colbert", "Tommy", "Roy"], answer: 0, exp: "Brad Pitt zagrał Willa Colberta, współzałożyciela klubu 'Nienawidzę Rachel Green'." },
    { q: "Jakie zwierzaki mieszkały w mieszkaniu Joeya i Chandlera?", options: ["Pies i kot", "Kurczak i Kaczka", "Papuga i chomik"], answer: 1, exp: "Mieli Kurczaka i Kaczkę (Chick and Duck)." },
    { q: "Do jakiego kraju przeniósł się Chandler w ramach ucieczki przed Janice?", options: ["Do Francji", "Wyspy Owcze", "Jemen"], answer: 2, exp: "Chandler skłamał Janice, że przenosi się do Jemenu pod adres '15 Yemen Road, Yemen'." },
    { q: "Jakie imię nosi córka Rachel i Rossa?", options: ["Emma", "Ella", "Erica"], answer: 0, exp: "Ich córka otrzymała imię Emma (imię oddane przez Monikę)." },
    { q: "Jakie imię nosi postać, za którą przebrał się Ross na Święto Dziękczynienia/Panczestka?", options: ["Świąteczna Pancernik (Holiday Armadillo)", "Święty Mikołaj", "Renifer"], answer: 0, exp: "Ross przebrał się za Świątecznego Pancernika, by nauczyć Bena o Hanuce." },
    { q: "Kim z zawodu jest ojciec Moniki i Rossa?", options: ["Jack Geller – biznesmen", "Richard Burke – lekarz", "Charles Bing"], answer: 0, exp: "Ojcem Moniki i Rossa był Jack Geller." },
    { q: "Kto z przyjął ostatecznie ślub Phoebe i Mike'a na ulicy w śnieżycy?", options: ["Joey", "Ross", "Chandler"], answer: 0, exp: "Joey udzielił im ślubu jako wyświęcony minister internetowy." },
    { q: "Jakie słynne zdanie powtarzał Ross w kwestii rozstania z Rachel?", options: ["We were on a break!", "I loved her!", "She left me!"], answer: 0, exp: "'Mieliśmy przerwę!' (We were on a break!) to flagowy tekst sporu Rossa i Rachel." },
    { q: "Jak nazywa się gra planszowa stworzona przez Chandlera, by dać Joeyowi pieniądze?", options: ["Cups", "Bamboozled", "Firehouse"], answer: 0, exp: "Chandler wymyślił bezsensowną grę w 'Kubki' (Cups), by przegrać z Joeyem i dać mu gotówkę." },
    { q: "Gdzie Monica spotkała swojego starszego partnera, dr. Richarda Burke'a?", options: ["W szpitalu", "Na przyjęciu u rodziców (był przyjacielem ojca)", "W kawiarni"], answer: 1, exp: "Richard był wieloletnim przyjacielem Jacka Gellera i okulistą." },
    { q: "Która aktorka zagrała matkę Moniki i Rossa (Judy Geller)?", options: ["Christina Pickles", "Teri Garr", "Morgan Fairchild"], answer: 0, exp: "Christina Pickles wcieliła się w postać chłodnej matki – Judy Geller." },
    { q: "Jakie imię nosił kot bez sierści (Sphynx) kupiony przez Rachel?", options: ["Mrs. Whiskerson", "Fluffy", "Baldy"], answer: 0, exp: "Rachel kupiła drogiego kota Mrs. Whiskerson, który okazał się bardzo agresywny." },
    { q: "Na jakim instrumencie próbował grać Ross przed ślubem Moniki i Chandlera?", options: ["Na dudach", "Na skrzypcach", "Na puzonie"], answer: 0, exp: "Ross uczył się grać na dudach, by niespodziewanie zagrać na ślubie." },
    { q: "Który z bohaterów pracował jako model na plakatach kampanii dotyczącej chorób wenerycznych?", options: ["Joey", "Chandler", "Ross"], answer: 0, exp: "Joey pozował do plakatów 'Mario ma wenerę' (VD)." },
    { q: "Jak nazywała się matka Phoebe, która popełniła samobójstwo?", options: ["Lily", "Phoebe", "Ursula"], answer: 0, exp: "Biologiczna matka nazywała się Phoebe, ale wychowywała ją Lily Buffay." },
    { q: "Jak miały na imię trojaczki urodzone przez Phoebe?", options: ["Frank Jr. Jr., Leslie, Chandler", "Ben, Emma, Jack", "Joey, Ross, Monica"], answer: 0, exp: "Phoebe nazwała je Frank Jr. Jr., Leslie oraz Chandler (który okazał się dziewczynką)." },

    { q: "Co dostał Chandler na przeprosiny od Joeya, gdy spędził czas w drewnianej skrzyni?", options: ["Wybaczenie za pocałowanie dziewczyny Joeya (Kathy)", "Zegarek", "Nowy fotel"], answer: 0, exp: "Chandler siedział w skrzyni w Dzień Dziękczynienia, by odzyskać zaufanie Joeya po pocałowaniu Kathy." },

    { q: "Jakie imię nosiła szalona współlokatorka Chandlera, gdy Joey się wyprowadził?", options: ["Eddie", "Kip", "Mark"], answer: 0, exp: "Eddie Menuek był nieprzewidywalnym i szalonym współlokatorem Chandlera." },
