<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wielki Quiz Friends</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fdf2f8;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .score-badge {
            background-color: #fef3c7;
            color: #b45309;
        }
        .progress-bar-bg {
            background-color: #e5e7eb;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background-color: #6366f1;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #6366f1;
            background: #f4f4ff;
        }
        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d;
            font-weight: 600;
        }
        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c;
        }
        .explanation {
            background-color: #f3f4f6;
            border-left: 4px solid #6366f1;
            padding: 12px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .next-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.2s;
        }
        .next-btn:hover {
            background-color: #4f46e5;
        }
        .results-container {
            text-align: center;
            display: none;
        }
        .iq-score {
            font-size: 48px;
            font-weight: 800;
            color: #6366f1;
            margin: 16px 0 8px 0;
        }
        .iq-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .feedback {
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-screen">
        <div class="header">
            <span class="badge">Pytanie <span id="current-question-num">1</span> z <span id="total-questions">50</span></span>
            <span class="badge score-badge">Punkty: <span id="current-score">0</span></span>
        </div>
        
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress"></div>
        </div>

        <div class="question-text" id="question-text">Pytanie ładowanie...</div>

        <div class="options-grid" id="options-container"></div>

        <div class="explanation" id="explanation-box">
            <strong id="explanation-title"></strong>
            <p id="explanation-text"></p>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Następne pytanie</button>
    </div>

    <div class="results-container" id="results-screen">
        <h2>Wynik Quizu Friends</h2>
        <div class="iq-score" id="iq-value">IQ ---</div>
        <div class="iq-title" id="iq-title">---</div>
        <p class="feedback" id="feedback-text">---</p>
        <button class="next-btn" style="display:block;" onclick="restartQuiz()">Zagraj ponownie</button>
    </div>
</div>

let currentIndex = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = questions[currentIndex];
    
    document.getElementById("total-questions").textContent = questions.length;
    document.getElementById("current-question-num").textContent = currentIndex + 1;
    document.getElementById("progress").style.width = `${((currentIndex) / questions.length) * 100}%`;
    document.getElementById("question-text").textContent = q.q;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    
    document.getElementById("explanation-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";

    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<strong>${String.fromCharCode(65 + idx)}.</strong> ${opt}`;
        btn.onclick = () => checkAnswer(idx, btn);
        container.appendChild(btn);
    });
}

function checkAnswer(selectedIndex, selectedBtn) {
    if (answered) return;
    answered = true;
    
    const q = questions[currentIndex];
    const buttons = document.querySelectorAll(".option-btn");

    buttons.forEach(btn => btn.disabled = true);

    if (selectedIndex === q.answer) {
        selectedBtn.classList.add("correct");
        score++;
        document.getElementById("current-score").textContent = score;
        document.getElementById("explanation-title").textContent = "✓ Świetnie! (+1 pkt)";
        document.getElementById("explanation-title").style.color = "#15803d";
    } else {
        selectedBtn.classList.add("incorrect");
        buttons[q.answer].classList.add("correct");
        document.getElementById("explanation-title").textContent = "✕ Niestety błąd!";
        document.getElementById("explanation-title").style.color = "#b91c1c";
    }

    document.getElementById("explanation-text").textContent = q.exp;
    document.getElementById("explanation-box").style.display = "block";
    
    if (currentIndex < questions.length - 1) {
        document.getElementById("next-btn").textContent = "Następne pytanie";
    } else {
        document.getElementById("next-btn").textContent = "Podsumuj wynik i oblicz IQ";
    }
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("results-screen").style.display = "block";
    
    const percent = (score / questions.length) * 100;
    let iqScore = "";
    let iqTitle = "";
    let feedback = "";

    if (percent >= 90) {
        iqScore = "IQ 150+";
        iqTitle = "☕ Archianalityk Central Perk";
        feedback = "Niesamowite! Twoja wiedza o serialu 'Przyjaciele' jest na poziomie eksperckim! Znasz każdy szczegół, cytat i anegdotę.";
    } else if (percent >= 70) {
        iqScore = "IQ 130 - 140";
        iqTitle = "🛋️ Wesoły Bywalec Nowego Jorku";
        feedback = "Gratulacje! Twój wynik wskazuje na bardzo wysokie IQ fanowskie. Oglądałeś serial z dużą uwagą!";
    } else if (percent >= 50) {
        iqScore = "IQ 110 - 120";
        iqTitle = "🍕 Przyjaciel z Kanapy";
        feedback = "Dobry wynik! Znasz najważniejsze wątki. Wystarczy krótki maraton na kanapie, aby zdobyć komplet punktów!";
    } else {
        iqScore = "IQ 95";
        iqTitle = "☕ Nowicjusz w Central Perk";
        feedback = "Test okazał się wyzwaniem! Czas odpalić 1. sezon od nowa!";
    }

    document.getElementById("iq-value").textContent = iqScore;
    document.getElementById("iq-title").textContent = iqTitle;
    document.getElementById("feedback-text").textContent = feedback;
}

function restartQuiz() {
    currentIndex = 0;
    score = 0;
    document.getElementById("current-score").textContent = s
